<!DOCTYPE html>
<html lang="de" data-theme="dark">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZFD – Zukunft für Deutschland</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css"/>

<style>

/* =========================
   ROOT
========================= */

:root{
  --bg:#020617;
  --text:#f8fafc;
  --muted:#94a3b8;
  --primary:#2563eb;
  --primary2:#3b82f6;
  --card:rgba(15,23,42,0.7);
  --border:rgba(255,255,255,0.08);
}

html[data-theme="light"]{
  --bg:#f8fafc;
  --text:#020617;
  --muted:#475569;
  --card:rgba(255,255,255,0.75);
  --border:rgba(0,0,0,0.08);
}

/* =========================
   BASE
========================= */

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* =========================
   CURSOR
========================= */

.cursor{
  position:fixed;
  width:20px;
  height:20px;
  border-radius:50%;
  background:rgba(59,130,246,0.4);
  pointer-events:none;
  transform:translate(-50%,-50%);
  filter:blur(8px);
  z-index:9999;
}

/* =========================
   SCROLL BAR
========================= */

::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{
  background:linear-gradient(var(--primary),var(--primary2));
  border-radius:20px;
}

/* =========================
   PARTICLES
========================= */

#particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
}

.p{
  position:absolute;
  background:rgba(96,165,250,0.6);
  border-radius:50%;
  animation:float linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh);opacity:0}
  10%{opacity:1}
  to{transform:translateY(-120vh);opacity:0}
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  background:rgba(2,6,23,0.7);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.nav{
  width:min(1200px,92%);
  margin:auto;
  display:flex;
  justify-content:space-between;
  padding:18px 0;
}

.logo{
  font-weight:900;
  font-size:1.5rem;
  background:linear-gradient(90deg,#fff,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* =========================
   HERO
========================= */

.hero{
  min-height:90vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px;
}

.hero h1{
  font-size:clamp(3rem,6vw,6rem);
  font-weight:900;
  background:linear-gradient(#fff,#60a5fa);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  max-width:800px;
  color:var(--muted);
  margin-top:20px;
  transition:0.5s;
}

/* =========================
   GRID / CARDS
========================= */

.grid{
  width:min(1200px,92%);
  margin:80px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:25px;
  border-radius:18px;
  transition:0.3s;
  transform-style:preserve-3d;
}

.card:hover{
  transform:translateY(-10px) rotateX(5deg) rotateY(5deg);
}

/* =========================
   TERMINAL
========================= */

#terminal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  color:#22c55e;
  font-family:monospace;
  padding:40px;
  display:none;
  z-index:99999;
  white-space:pre-line;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:50px;
  color:var(--muted);
}

</style>
</head>

<body>

<div class="cursor" id="cursor"></div>
<div id="particles"></div>
<div id="terminal"></div>

<header>
  <div class="nav">
    <div class="logo">ZFD</div>
    <div>Programm | Kontakt</div>
  </div>
</header>

<section class="hero">
  <h1>Zukunft für Deutschland</h1>
  <p id="heroText">Heimat. Freiheit. Zukunft.</p>
</section>

<section class="grid">

  <div class="card"><h3>Sicherheit</h3><p>Stabile Ordnung</p></div>
  <div class="card"><h3>Wirtschaft</h3><p>Innovation</p></div>
  <div class="card"><h3>Bildung</h3><p>Zukunft</p></div>

</section>

<footer>
  Diese Website wurde von Jakob und Jason gemacht für den WiPo Unterricht.
</footer>

<script>

/* CURSOR */
const cursor=document.getElementById("cursor");
document.addEventListener("mousemove",e=>{
  cursor.style.left=e.clientX+"px";
  cursor.style.top=e.clientY+"px";
});

/* PARTICLES */
const container=document.getElementById("particles");
for(let i=0;i<50;i++){
  const d=document.createElement("div");
  d.className="p";
  d.style.width=d.style.height=Math.random()*5+2+"px";
  d.style.left=Math.random()*100+"vw";
  d.style.animationDuration=(Math.random()*10+5)+"s";
  container.appendChild(d);
}

/* HERO TEXT SWITCH */
const texts=[
"Gemeinsam Zukunft gestalten",
"Sicherheit & Stabilität",
"Innovation für Deutschland"
];
let i=0;
setInterval(()=>{
  i=(i+1)%texts.length;
  document.getElementById("heroText").innerText=texts[i];
},4000);

/* KONAMI CODE */
let k=[];
const code=["arrowup","arrowup","arrowdown","arrowdown","arrowleft","arrowright","arrowleft","arrowright","b","a"];

document.addEventListener("keydown",e=>{
  k.push(e.key.toLowerCase());
  k=k.slice(-10);

  if(JSON.stringify(k)===JSON.stringify(code)){
    document.body.style.filter="hue-rotate(20deg)";
    alert("Geheimer Modus aktiviert");
  }
});

/* FAKE TERMINAL (50 CLICKS) */
let clicks=0;
document.addEventListener("click",()=>{
  clicks++;
  if(clicks===50){
    const t=document.getElementById("terminal");
    t.style.display="block";

    const lines=[
      "Verbinde mit Server...",
      "Analyse gestartet...",
      "ZFD System geladen...",
      "ZUGRIFF GEWÄHRT ✓"
    ];

    let i=0;
    let int=setInterval(()=>{
      t.innerText+=lines[i]+"\n";
      i++;
      if(i>=lines.length) clearInterval(int);
    },700);

    setTimeout(()=>{
      t.style.display="none";
      t.innerText="";
    },6000);
  }
});

</script>

</body>
</html>
